name: Security SCA

on:
  pull_request:
    paths:
      - .github/workflows/security-sca.yml
      - anapath-back/package.json
      - anapath-back/package-lock.json
      - anapath-front/package.json
      - anapath-front/package-lock.json
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/security-sca.yml
      - anapath-back/package.json
      - anapath-back/package-lock.json
      - anapath-front/package.json
      - anapath-front/package-lock.json
  schedule:
    - cron: '18 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-dependency-audit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: backend
            path: anapath-back
          - name: frontend
            path: anapath-front

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.app.path }}

      - name: Audit production dependencies
        run: npm run security:audit:prod
        working-directory: ${{ matrix.app.path }}

  full-dependency-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: backend
            path: anapath-back
          - name: frontend
            path: anapath-front

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.app.path }}

      - name: Audit full dependency tree
        run: npm run security:audit:full
        working-directory: ${{ matrix.app.path }}
